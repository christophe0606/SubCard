[package]
name = "subcard-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1.2"

# Keep development builds small; GPUI has a substantial dependency graph.
[profile.dev]
debug = 0

